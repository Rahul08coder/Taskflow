<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — TaskFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-brand">
                <span class="brand-mark">TF</span>
                <span class="brand-name">TaskFlo<span>w</span></span>
            </div>

            <div class="auth-title">Create your account</div>
            <div class="auth-subtitle">Register with any email — no verification needed.</div>

            <div id="register-error" class="auth-error" hidden></div>

            <form id="register-form">
                <div class="auth-field">
                    <label for="reg-name">Name</label>
                    <input type="text" id="reg-name" class="control" placeholder="Your name" required>
                </div>
                <div class="auth-field">
                    <label for="reg-email">Email</label>
                    <input type="email" id="reg-email" class="control" placeholder="you@example.com" required>
                </div>
                <div class="auth-field">
                    <label for="reg-password">Password</label>
                    <input type="password" id="reg-password" class="control" placeholder="At least 6 characters" required minlength="6">
                </div>
                <button type="submit" class="btn-new auth-submit">Create account</button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="login.html">Log in</a>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = "http://127.0.0.1:8000";

        const registerForm = document.getElementById("register-form");
        const registerError = document.getElementById("register-error");

        registerForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            registerError.hidden = true;

            const name = document.getElementById("reg-name").value.trim();
            const email = document.getElementById("reg-email").value.trim();
            const password = document.getElementById("reg-password").value;

            try {
                const res = await fetch(`${API_BASE}/auth/register`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name, email, password }),
                });

                if (!res.ok) {
                    const err = await res.json();
                    let message = "Registration failed.";
                    if (typeof err.detail === "string") {
                        message = err.detail;
                    } else if (Array.isArray(err.detail) && err.detail[0]) {
                        message = err.detail[0].msg || message;
                    }
                    registerError.textContent = message;
                    registerError.hidden = false;
                    return;
                }

                // Success — send them to the login page with a friendly hint.
                window.location.href = "login.html?registered=1";
            } catch (e) {
                console.error("Register failed:", e);
                registerError.textContent = "Network error — check the backend is running.";
                registerError.hidden = false;
            }
        });
    </script>
</body>
</html>
